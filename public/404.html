<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this file for any path it cannot find on disk, which
      // is every client-side route (/project/*). Without it, opening or
      // refreshing a shared project link returns a GitHub 404 instead of the app.
      //
      // The path is stashed in sessionStorage and replayed by index.html once
      // React Router has mounted, so the visitor lands on the route they asked
      // for and the URL bar never shows the redirect.
      sessionStorage.setItem(
        "spa-redirect",
        window.location.pathname + window.location.search + window.location.hash
      );
      window.location.replace("/");
    </script>
  </head>
  <body>
    <noscript>
      <p>This page requires JavaScript. <a href="/">Return to the homepage.</a></p>
    </noscript>
  </body>
</html>
