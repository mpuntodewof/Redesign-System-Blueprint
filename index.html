    <meta name="twitter:card" content="summary_large_image" />
    <!--
      The hero portrait is the LCP element but lives inside a React component,
      so the preload scanner cannot see it until the bundle has executed.
      Preloading here starts the fetch alongside the JS instead of after it.
      imagesrcset must mirror Hero.tsx's srcSet or the browser preloads a
      variant the component never requests.
    -->
    <link
      rel="preload"
      as="image"
      href="/profile-640.webp"
      imagesrcset="/profile-320.webp 320w, /profile-640.webp 640w"
      imagesizes="(min-width: 1024px) 320px, (min-width: 640px) 288px, 256px"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "e919f767524e4ff4827bc979e5cbcad7", "spa": true}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
